[package]
name = "rust-stack"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Unified 100% Pure-Rust Sovereign Stack: Better-Auth, shadcn_rs, Open-WebUI, OpenCode, and OpenAI Gateway + C-ABI FFI"

[[bin]]
name = "rust-stack"
path = "src/main.rs"

[lib]
name = "rust_stack_ffi"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.49", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
